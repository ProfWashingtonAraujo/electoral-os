services:
  db:
    image: postgres:15-alpine
    container_name: electoral-os-db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=electoral_pass
      - POSTGRES_DB=electoral_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
